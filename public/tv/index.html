<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Quiz TV</title>
  <link rel="preload" href="/commun/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/commun/theme.css">
  <link rel="stylesheet" href="/commun/commun.css">
  <link rel="stylesheet" href="/tv/tv.css">
</head>
<body>
  <!-- Toujours conçue en 1920×1080, puis mise à l'échelle de la fenêtre par ajusterEchelle(). -->
  <div id="scene" class="scene">
    <main data-ecran="lobby" hidden>
      <section class="carte-rejoindre rebond">
        <img id="qr" class="qr" alt="QR code pour rejoindre">
        <p class="url" id="url"></p>
        <p class="code">Code <strong id="code"></strong></p>
      </section>
      <section class="joueurs">
        <h1 class="titre">Quiz TV</h1>
        <ul class="etiquettes" id="liste-joueurs"></ul>
        <p class="attente">En attente que l'hôte lance</p>
      </section>
    </main>

    <main data-ecran="quiz-question" hidden>
      <div class="tv-haut">
        <p class="numero" id="numero-question"></p>
        <div class="barre-temps"><div class="barre-temps-remplie" id="barre-temps"></div></div>
        <p class="chrono" id="chrono"></p>
      </div>
      <h1 class="question rebond" id="texte-question"></h1>
      <ol class="reponses" id="reponses-question"></ol>
      <ul class="etiquettes ont-repondu" id="ont-repondu"></ul>
    </main>

    <main data-ecran="quiz-revelation" hidden>
      <div class="tv-haut">
        <p class="numero" id="numero-revelation"></p>
      </div>
      <h1 class="question" id="texte-revelation"></h1>
      <ol class="reponses" id="reponses-revelation"></ol>
      <ol class="classement" id="classement-revelation"></ol>
    </main>

    <main data-ecran="podium" hidden>
      <h1 class="titre">Partie terminée</h1>
      <div class="podium">
        <div class="marche marche-2"><ul class="noms" id="podium-2"></ul><div class="socle">2</div></div>
        <div class="marche marche-1"><ul class="noms" id="podium-1"></ul><div class="socle">1</div></div>
        <div class="marche marche-3"><ul class="noms" id="podium-3"></ul><div class="socle">3</div></div>
      </div>
      <ol class="classement" id="classement-podium"></ol>
      <p class="attente">L'hôte peut relancer</p>
    </main>

    <aside id="qr-coin" class="qr-coin" hidden>
      <img id="qr-coin-image" class="qr" alt="QR code pour rejoindre">
      <p id="code-coin"></p>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/tv/tv.js"></script>
  <script src="/tv/modes/quiz.js"></script>
</body>
</html>
